# Builds the JupyterLite site from ./content and publishes it to GitHub Pages
# (learn.pharmakaksha.com) every time you push to the main branch.
name: Build and deploy learn.pharmakaksha.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JupyterLite
        run: pip install -r requirements.txt
      # Notebooks store each output line as a list item. JupyterLite has no
      # server to join them, so saved outputs show "," at the start of lines.
      # Join them into single strings in the build copy (the repo is untouched).
      - name: Join saved output lines
        shell: python
        run: |
          import glob, json
          for path in glob.glob("content/**/*.ipynb", recursive=True):
              with open(path, encoding="utf-8") as f:
                  nb = json.load(f)
              for cell in nb["cells"]:
                  for out in cell.get("outputs", []):
                      if isinstance(out.get("text"), list):
                          out["text"] = "".join(out["text"])
                      for mime, value in out.get("data", {}).items():
                          if isinstance(value, list):
                              out["data"][mime] = "".join(value)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(nb, f, indent=1, ensure_ascii=False)
      - name: Build the site
        run: jupyter lite build
      - name: Keep the custom domain
        run: cp CNAME dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
