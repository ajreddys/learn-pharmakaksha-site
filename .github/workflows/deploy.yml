# Builds the JupyterLite site from ./content and publishes it to GitHub Pages
# (learn.pharmakaksha.com) every time you push to the main branch.
name: Build and deploy learn.pharmakaksha.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JupyterLite
        run: pip install -r requirements.txt
      - name: Build the site
        run: jupyter lite build
      - name: Keep the custom domain
        run: cp CNAME dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
